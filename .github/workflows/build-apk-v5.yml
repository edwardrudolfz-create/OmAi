name: Build OmAi APK v5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Extract OmAi source
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q OmAi-Source.zip -d extracted
          echo "Extracted project:"
          ls -la extracted/OmAi

      - name: Configure Android project
        working-directory: extracted/OmAi
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties
          cat local.properties

      - name: Clone llama.cpp
        working-directory: extracted/OmAi/app/src/main/cpp
        run: |
          rm -rf llama
          git clone --depth 1 --branch b3600 \
            https://github.com/ggerganov/llama.cpp.git llama \
            || git clone --depth 1 \
            https://github.com/ggerganov/llama.cpp.git llama

          echo "llama.cpp contents:"
          ls -la llama | head -30

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/ndk/27.0.12077973" | head

      - name: Build APK
        working-directory: extracted/OmAi
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee ../../build.log

      - name: Find and prepare APK
        run: |
          APK=$(find extracted/OmAi/app/build/outputs/apk -type f -name "*.apk" | head -1)

          if [ -z "$APK
