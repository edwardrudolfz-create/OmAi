name: Build OmAi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Extract OmAi source
        run: |
          mkdir extracted
          unzip -q OmAi-Source.zip -d extracted
          ls -la extracted/OmAi

      - name: Configure Android project
        working-directory: extracted/OmAi
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties

      - name: Clone llama.cpp
        working-directory: extracted/OmAi/app/src/main/cpp
        run: |
          rm -rf llama
          git clone --depth 1 --branch b3600 \
            https://github.com/ggerganov/llama.cpp.git llama \
            || git clone --depth 1 \
            https://github.com/ggerganov/llama.cpp.git llama

      - name: Create Gradle wrapper if needed
        working-directory: extracted/OmAi
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build APK
        working-directory: extracted/OmAi
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../build.log

      - name: Prepare APK
        run: |
          APK=$(find extracted/OmAi/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi
          cp "$APK" OmAi-v1.0-debug.apk
          ls -lh OmAi-v1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmAi-v1.0-debug
          path: OmAi-v1.0-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmAi-build-log
          path: build.log
          if-no-files-found: ignore
