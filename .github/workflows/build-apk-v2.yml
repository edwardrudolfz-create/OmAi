name: Build OmAi APK v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Extract OmAi source
        run: |
          mkdir extracted
          unzip -q OmAi-Source.zip -d extracted
          ls -la extracted/OmAi

      - name: Configure Android project
        working-directory: extracted/OmAi
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> local.properties

      - name: Clone llama.cpp
        working-directory: extracted/OmAi/app/src/main/cpp
        run: |
          rm -rf llama
          git clone --depth 1 --branch b3600 \
            https://github.com/ggerganov/llama.cpp.git llama \
            || git clone --depth 1 \
            https://github.com/ggerganov/llama.cpp.git llama

      - name: Prepare Gradle
        working-directory: extracted/OmAi
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build APK
        working-directory: extracted/OmAi
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../build.log

      - name: Prepare APK
        run: |
          APK=$(find extracted/OmAi/app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" OmAi-v1.0-debug.apk
          ls -lh OmAi-v1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmAi-v1.0-debug
          path: OmAi-v1.0-debug.apk
